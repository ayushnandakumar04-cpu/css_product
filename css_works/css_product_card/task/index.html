<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punch-Monster-Product-Card</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="card">

        <div class="card-image">
            <img src="images/image.png" alt="">
        </div>
        <div class="card-content">

            <div class="card-text">
            <p>PUNCH MONSTER</p>
            <h2 class="card-product"> Punch Monster</h2>
            <h2 class="card-price">$100<span class="old-price">$200</span></h2>
            </div>
            <button>BUY</button>
        </div>
    </div>

</body>

</html>
