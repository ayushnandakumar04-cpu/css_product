<!DOCTYPE html>
<html lang="en">
<head>
    <style>
         h1{
            background-color: blueviolet;
            color: rgb(123, 56, 8);
        }

        h2{
            background-color: rgb(203, 163, 111);
            color: rgb(1, 16, 11);
            border: 2px solid black;
        }

        .heading{
            background-color: rgb(81, 34, 81);
            color: rgb(7, 7, 30);
        }
        .bg-danger{
            background-color: rgb(46, 159, 159);
            color:rgb(0, 7, 0)
        }
        .border-sucess{
            border: 2px solid green;
        }
        .bg-primary{
             background-color: burlywood;
        }

        .text-white{
           
            color: white;
        }

        /* red => danger,green=>sucess,yellow=> warning,blue=>primary */
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INT_CSS</title>
</head>
<body>
    <h1>Internal CSS</h1>
    <h2>Welcome to CSS</h2>
    <h1 class="heading">Python Django</h1>
    <h1 class="bg-danger border-sucess">DjangoRestFramework(DRF)</h1>
    <h1 class="bg-primary text-white">HTML</h1>

</body>
</html>
